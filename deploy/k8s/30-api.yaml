apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-api
  namespace: nimbus
  labels:
    app: nimbus-api
spec:
  # The realtime hub keeps socket rooms in memory. Scaling past 1 replica needs sticky
  # sessions plus a shared Socket.IO adapter (e.g. @socket.io/redis-adapter).
  replicas: 1
  selector:
    matchLabels:
      app: nimbus-api
  template:
    metadata:
      labels:
        app: nimbus-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/nimbus-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: nimbus-config
            - secretRef:
                name: nimbus-secrets
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus-api
  namespace: nimbus
spec:
  selector:
    app: nimbus-api
  ports:
    - port: 3001
      targetPort: 3001
