apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nimbus-postgres
  namespace: nimbus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-postgres
  namespace: nimbus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nimbus-postgres
  template:
    metadata:
      labels:
        app: nimbus-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: nimbus
            - name: POSTGRES_DB
              value: nimbus
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nimbus"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nimbus-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus-postgres
  namespace: nimbus
spec:
  selector:
    app: nimbus-postgres
  ports:
    - port: 5432
      targetPort: 5432
